<!-- Dev preview chip — auth / layout / palette toggles.
     Floating, draggable. Include on any page via:
       <div data-include="partials/state-chip.html"></div>
     Drives body[data-auth], body[data-layout], html[data-palette].
     See js/apple-layout.js. -->
<div class="state-chip" role="group" aria-label="Preview options">
    <span class="dev-tag" title="Drag to move · double-click to reset">preview</span>
    <div class="chip-group">
        <span class="label">Auth:</span>
        <div class="pill-group">
            <button type="button" data-auth-set="out">Logged out</button>
            <button type="button" data-auth-set="in" class="active">Logged in</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Layout:</span>
        <div class="pill-group">
            <button type="button" data-layout-set="top" class="active">Top nav</button>
            <button type="button" data-layout-set="side">Sidebar</button>
            <button type="button" data-layout-set="rail">Icon rail</button>
            <button type="button" data-layout-set="boxed">Boxed</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Sidebar:</span>
        <div class="pill-group">
            <button type="button" data-sidebar-set="light" class="active" title="Frosted light menu (default)">Light</button>
            <button type="button" data-sidebar-set="tinted" title="Soft wash of the active accent palette">Tinted</button>
            <button type="button" data-sidebar-set="dark" title="Warm charcoal menu, light content — macOS Finder style">Dark</button>
            <button type="button" data-sidebar-set="graphite" title="Cool blue-gray dark menu">Graphite</button>
            <button type="button" data-sidebar-set="brand" title="Bold solid-accent menu — follows the palette">Brand</button>
            <button type="button" data-sidebar-set="gradient" title="Accent menu with a gradient fall — follows the palette">Gradient</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Header:</span>
        <div class="pill-group">
            <button type="button" data-header-set="light" class="active" title="Frosted light top bar (default)">Light</button>
            <button type="button" data-header-set="tinted" title="Soft wash of the active accent palette">Tinted</button>
            <button type="button" data-header-set="dark" title="Warm charcoal top bar">Dark</button>
            <button type="button" data-header-set="graphite" title="Cool blue-gray top bar">Graphite</button>
            <button type="button" data-header-set="brand" title="Bold solid-accent top bar — follows the palette">Brand</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Side logo:</span>
        <div class="pill-group">
            <button type="button" data-sidebarlogo-set="show" class="active" title="Show the logo at the top of the left sidebar">Show</button>
            <button type="button" data-sidebarlogo-set="hide" title="Hide the sidebar logo">Hide</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Box sidebar:</span>
        <div class="pill-group">
            <button type="button" data-boxsidebar-set="show" class="active" title="Show the sidebar inside the box (boxed layout)">Show</button>
            <button type="button" data-boxsidebar-set="hide" title="Hide the sidebar &mdash; content fills the box">Hide</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Box frame:</span>
        <div class="pill-group">
            <button type="button" data-boxframe-set="card" class="active" title="Floating card with shadow + rounded corners">Card</button>
            <button type="button" data-boxframe-set="flat" title="No shadow, no lines &mdash; just centered content">Flat</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Icons:</span>
        <div class="pill-group">
            <button type="button" data-icons-set="colorful" class="active" title="Colored icon tiles (default)">Colorful</button>
            <button type="button" data-icons-set="mono" title="All icons one theme color (set via Icon tiles &rarr; Uniform)">Mono</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Crumbs:</span>
        <div class="pill-group">
            <button type="button" data-crumbs-set="trail" class="active" title="Full breadcrumb trail (current)">Trail</button>
            <button type="button" data-crumbs-set="back" title="Apple-style single back link, no grey bar">Back</button>
            <button type="button" data-crumbs-set="none" title="No breadcrumb — rely on the page title">None</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Data:</span>
        <div class="pill-group">
            <button type="button" data-data-set="full" class="active">Full</button>
            <button type="button" data-data-set="empty">Empty</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Status:</span>
        <div class="pill-group">
            <button type="button" data-status-set="active" class="active">Active</button>
            <button type="button" data-status-set="suspended">Suspended</button>
            <button type="button" data-status-set="pending">Pending</button>
            <button type="button" data-status-set="terminated">Terminated</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Align:</span>
        <div class="pill-group">
            <button type="button" data-align-set="center" class="active" title="Center the combined content + sub-nav unit">Center</button>
            <button type="button" data-align-set="content" title="Center the content column only — ignore the sub-nav for centering math">Content</button>
            <button type="button" data-align-set="left">Left</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Sub-nav:</span>
        <div class="pill-group">
            <button type="button" data-subnav-set="on" class="active">Show</button>
            <button type="button" data-subnav-set="off">Hide</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Sub-nav side:</span>
        <div class="pill-group">
            <button type="button" data-subnav-side-set="left">Left</button>
            <button type="button" data-subnav-side-set="right" class="active">Right</button>
            <button type="button" data-subnav-side-set="outside-left" title="Float in the left outer gutter, outside the content column">Outside L</button>
            <button type="button" data-subnav-side-set="outside" title="Float in the right outer gutter, outside the content column">Outside R</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Services:</span>
        <div class="pill-group">
            <button type="button" data-svc-layout-set="inside" class="active" title="Search &amp; pagination inside the white card (column titles outside)">Controls inside</button>
            <button type="button" data-svc-layout-set="outside" title="Only service rows in the white card; controls float on the page">Controls outside</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Title:</span>
        <div class="pill-group">
            <button type="button" data-mintitle-set="outside" class="active" title="Minimal dashboard: section titles on the page background, above each card (default)">Outside block</button>
            <button type="button" data-mintitle-set="inside" title="Minimal dashboard: section titles inside the white card, as a card header">Inside block</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Block style:</span>
        <div class="pill-group">
            <button type="button" data-blkstyle-set="white" class="active" title="Adaptable blocks: white cards (default)">White</button>
            <button type="button" data-blkstyle-set="accent" title="Adaptable blocks: filled with the accent colour">Accent</button>
            <button type="button" data-blkstyle-set="tint" title="Adaptable blocks: soft accent tint, dark text">Tint</button>
            <button type="button" data-blkstyle-set="gradient" title="Adaptable blocks: accent gradient">Gradient</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Layout map:</span>
        <div class="pill-group">
            <button type="button" data-layoutmap-set="off" class="active" title="Hide the block position map">Off</button>
            <button type="button" data-layoutmap-set="on" title="Overlay each block with its grid position, to align them">On</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Tiles:</span>
        <div class="pill-group">
            <button type="button" data-tiles-set="all" class="active" title="Show all variants">All</button>
            <button type="button" data-tiles-set="a" title="Variant A — vertical">A</button>
            <button type="button" data-tiles-set="b" title="Variant B — horizontal">B</button>
            <button type="button" data-tiles-set="c" title="Variant C — tinted">C</button>
            <button type="button" data-tiles-set="d" title="Variant D — list">D</button>
            <button type="button" data-tiles-set="f" title="Variant F — list horizontal">F</button>
            <button type="button" data-tiles-set="e" title="Variant E — rings">E</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Form:</span>
        <div class="pill-group">
            <button type="button" data-form-set="all" class="active" title="Show all form variants">All</button>
            <button type="button" data-form-set="a" title="2-col dense grid">A</button>
            <button type="button" data-form-set="b" title="Sectioned cards">B</button>
            <button type="button" data-form-set="c" title="Single column stack">C</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Product:</span>
        <div class="pill-group">
            <button type="button" data-product-set="all" class="active" title="Show all variants">All</button>
            <button type="button" data-product-set="a" title="Left sidebar layout">A</button>
            <button type="button" data-product-set="b" title="Top-tabs layout">B</button>
            <button type="button" data-product-set="c" title="Stacked sections layout">C</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Plan:</span>
        <div class="pill-group">
            <button type="button" data-plan-set="all" class="active" title="Show all plan variants">All</button>
            <button type="button" data-plan-set="a" title="Variant A — 3 packages, feature list">A</button>
            <button type="button" data-plan-set="b" title="Variant B — 4 packages, minimal">B</button>
            <button type="button" data-plan-set="c" title="Variant C — 5 packages, horizontal rows">C</button>
            <button type="button" data-plan-set="d" title="Variant D — side-by-side comparison">D</button>
            <button type="button" data-plan-set="e" title="Variant E — bento asymmetric">E</button>
            <button type="button" data-plan-set="f" title="Variant F — segmented bar">F</button>
            <button type="button" data-plan-set="g" title="Variant G — spec matrix">G</button>
            <button type="button" data-plan-set="h" title="Variant H — addon card with radio tiers">H</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Packages:</span>
        <div class="pill-group">
            <button type="button" data-packages-set="all" class="active" title="Show every package as authored">All</button>
            <button type="button" data-packages-set="1" title="Show 1 package">1</button>
            <button type="button" data-packages-set="2" title="Show 2 packages">2</button>
            <button type="button" data-packages-set="3" title="Show 3 packages">3</button>
            <button type="button" data-packages-set="4" title="Show 4 packages">4</button>
        </div>
    </div>
    <div class="chip-group">
        <span class="label">Palette:</span>
        <div class="swatch-group" role="group" aria-label="Color palette">
            <button type="button" data-palette="blue"    class="active" title="Apple Blue"></button>
            <button type="button" data-palette="emerald"                title="Emerald"></button>
            <button type="button" data-palette="violet"                 title="Violet"></button>
            <button type="button" data-palette="rose"                   title="Rose"></button>
            <button type="button" data-palette="amber"                  title="Amber"></button>
            <button type="button" data-palette="slate"                  title="Slate"></button>
        </div>
    </div>
</div>
