name: Deploy theme to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'mytheme/modules/addons/MyTheme/**'
      - 'mytheme/templates/mytheme/**'
      - 'mytheme_cart/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: cp2.de.namespace.life
      REMOTE_USER: whymege
      REMOTE_PORT: '22'
      REMOTE_BASE: /home/whymege/bill.hostnodes.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — need both SHAs to diff

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$REMOTE_PORT" -t ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compute diff & deploy only changed files
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi
          echo "Diff range: $BEFORE..$AFTER"

          SSH="ssh -i $HOME/.ssh/id_ed25519 -p $REMOTE_PORT -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST"

          # ─────────────────────────────────────────────────────────────
          # PASS 1: mytheme/  →  $REMOTE_BASE/  (strip "mytheme/" prefix)
          #   mytheme/templates/mytheme/header.tpl → templates/mytheme/header.tpl
          #   mytheme/modules/addons/MyTheme/x.php → modules/addons/MyTheme/x.php
          # ─────────────────────────────────────────────────────────────
          CHANGED_MAIN=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- 'mytheme/**' | grep -v '/\.' || true)
          DELETED_MAIN=$(git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" -- 'mytheme/**' | grep -v '/\.' || true)

          if [ -n "$CHANGED_MAIN" ]; then
            echo "=== Uploading mytheme/ changes ==="
            echo "$CHANGED_MAIN"
            echo "$CHANGED_MAIN" | tar czf - --files-from=- --transform='s|^mytheme/||' \
              | $SSH "tar xzpf - -C $REMOTE_BASE && echo '✅ mytheme upload complete'"
          fi

          if [ -n "$DELETED_MAIN" ]; then
            echo "=== Filtering deletes through safety allowlist ==="
            # SAFETY GUARD: only allow deletes inside the two intended subtrees.
            # Anything outside (e.g. mytheme/modules/autoload.php, mytheme/init.php)
            # is logged and SKIPPED so it can never reach `rm -f` on the server.
            SAFE_MAIN=$(echo "$DELETED_MAIN" | grep -E '^mytheme/(modules/addons/MyTheme|templates/mytheme)/' || true)
            BLOCKED=$(echo "$DELETED_MAIN" | grep -vE '^mytheme/(modules/addons/MyTheme|templates/mytheme)/' || true)
            if [ -n "$BLOCKED" ]; then
              echo "⚠️  BLOCKED from delete (outside allowed subtrees):"
              echo "$BLOCKED"
            fi
            if [ -n "$SAFE_MAIN" ]; then
              echo "=== Deleting safe mytheme/ files ==="
              echo "$SAFE_MAIN"
              DEL=$(echo "$SAFE_MAIN" | sed "s|^mytheme/|rm -f '$REMOTE_BASE/|; s|$|'|")
              echo "$DEL" | $SSH "bash -s"
            fi
          fi

          # ─────────────────────────────────────────────────────────────
          # PASS 2: mytheme_cart/  →  $REMOTE_BASE/templates/orderforms/mytheme_cart/
          #   mytheme_cart/css/x.css → templates/orderforms/mytheme_cart/css/x.css
          #   mytheme_cart/theme.yaml → templates/orderforms/mytheme_cart/theme.yaml
          # PASS 2 is inherently safe — the sed hardcodes the destination
          # subtree, so deletes can ONLY happen inside templates/orderforms/mytheme_cart/.
          # ─────────────────────────────────────────────────────────────
          CHANGED_CART=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- 'mytheme_cart/**' | grep -v '/\.' || true)
          DELETED_CART=$(git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" -- 'mytheme_cart/**' | grep -v '/\.' || true)

          if [ -n "$CHANGED_CART" ]; then
            echo "=== Uploading mytheme_cart/ changes ==="
            echo "$CHANGED_CART"
            echo "$CHANGED_CART" | tar czf - --files-from=- --transform='s|^mytheme_cart/|templates/orderforms/mytheme_cart/|' \
              | $SSH "tar xzpf - -C $REMOTE_BASE && echo '✅ mytheme_cart upload complete'"
          fi

          if [ -n "$DELETED_CART" ]; then
            echo "=== Deleting removed mytheme_cart/ files ==="
            echo "$DELETED_CART"
            DEL=$(echo "$DELETED_CART" | sed "s|^mytheme_cart/|rm -f '$REMOTE_BASE/templates/orderforms/mytheme_cart/|; s|$|'|")
            echo "$DEL" | $SSH "bash -s"
          fi

          if [ -z "$CHANGED_MAIN" ] && [ -z "$CHANGED_CART" ] && [ -z "$DELETED_MAIN" ] && [ -z "$DELETED_CART" ]; then
            echo "No files to upload or delete."
          fi
