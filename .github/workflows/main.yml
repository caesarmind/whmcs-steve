name: Deploy theme to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'mytheme/modules/addons/MyTheme/**'
      - 'mytheme/templates/mytheme/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: cp2.de.namespace.life
      REMOTE_USER: whymege
      REMOTE_PORT: '22'
      REMOTE_BASE: /home/whymege/bill.hostnodes.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — need both SHAs to diff

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$REMOTE_PORT" -t ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compute diff & deploy only changed files (archive + extract)
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi
          echo "Diff range: $BEFORE..$AFTER"

          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- 'mytheme/**' | grep -v '/\.' || true)
          DELETED=$(git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" -- 'mytheme/**' | grep -v '/\.' || true)

          SSH="ssh -i $HOME/.ssh/id_ed25519 -p $REMOTE_PORT -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST"

          if [ -n "$CHANGED" ]; then
            echo "=== Uploading changed files ==="
            echo "$CHANGED"
            # Bundle changed files into one gzipped tar stream, strip mytheme/ prefix,
            # pipe over a single SSH connection, extract on the server.
            echo "$CHANGED" | tar czf - --files-from=- --transform='s|^mytheme/||' \
              | $SSH "tar xzpf - -C $REMOTE_BASE && echo '✅ Upload complete'"
          else
            echo "No files to upload."
          fi

          if [ -n "$DELETED" ]; then
            echo "=== Deleting removed files ==="
            echo "$DELETED"
            DEL_CMDS=$(echo "$DELETED" | sed "s|^mytheme/|rm -f '$REMOTE_BASE/|; s|$|'|")
            echo "$DEL_CMDS" | $SSH "bash -s"
          fi
