name: Deploy theme to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'hadrian/modules/addons/Hadrian/**'
      - 'hadrian/templates/hadrian/**'
      - 'hadrian_cart/**'
      # the landing page and the two folders it embeds
      - 'hadrianthegreat-landind/**'
      - 'apple-client-area/**'
      - 'Hadrian by Caesarthemes/hadrian-admin-panel/**'
      - 'scripts/build-landing.mjs'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: cp2.de.namespace.life
      REMOTE_USER: whymege
      REMOTE_PORT: '22'
      REMOTE_BASE: /home/whymege/bill.hostnodes.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — need both SHAs to diff

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Non-fatal: the deploy SSH below uses StrictHostKeyChecking=no, so
          # known_hosts is never consulted. A flaky/timed-out ssh-keyscan must
          # not fail the whole deploy (it did, intermittently, on 2026-06-02).
          ssh-keyscan -p "$REMOTE_PORT" -t ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Compute diff & deploy only changed files
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi
          echo "Diff range: $BEFORE..$AFTER"

          SSH="ssh -i $HOME/.ssh/id_ed25519 -p $REMOTE_PORT -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST"

          # --------------------------------------------------------------
          # PASS 1: hadrian/  ->  $REMOTE_BASE/  (strip "hadrian/" prefix)
          #   hadrian/templates/hadrian/header.tpl  -> templates/hadrian/header.tpl
          #   hadrian/modules/addons/Hadrian/x.php  -> modules/addons/Hadrian/x.php
          # "hadrian/" is the repo container folder; it is stripped on deploy,
          # so the server tree is modules/addons/Hadrian + templates/hadrian.
          # --------------------------------------------------------------
          # Restricted to the two subtrees that belong on the server — the same
          # pair the `paths:` trigger names and the delete allowlist below
          # enforces. It used to glob all of 'hadrian/**', which quietly shipped
          # hadrian/scripts/ (build + lint tooling) into the web root: 16 files
          # fetchable at https://<site>/scripts/, including a curl cookie jar
          # holding a live session cookie. Anything outside these two paths is
          # repo-side tooling and has no business on a billing site.
          #
          # The dotfile filter below was `grep -v '/\.'`, which excluded EVERY
          # dotfile — including the .htaccess files that deny direct HTTP access
          # to .tpl source. Adding those files to the repo would have looked
          # like a fix and shipped nothing. The awk keeps the same protection
          # (.git, .env, .DS_Store and even .htaccess.bak are still excluded)
          # and lets exactly `.htaccess` through, at any depth.
          UPLOAD_PATHS='hadrian/modules/addons/Hadrian/**'
          UPLOAD_PATHS2='hadrian/templates/hadrian/**'
          CHANGED_MAIN=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- "$UPLOAD_PATHS" "$UPLOAD_PATHS2" | awk '!/\/\./ || /\/\.htaccess$/' || true)
          DELETED_MAIN=$(git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" -- "$UPLOAD_PATHS" "$UPLOAD_PATHS2" | awk '!/\/\./ || /\/\.htaccess$/' || true)

          if [ -n "$CHANGED_MAIN" ]; then
            echo "=== Uploading hadrian/ changes ==="
            echo "$CHANGED_MAIN"
            echo "$CHANGED_MAIN" | tar czf - --files-from=- --transform='s|^hadrian/||' \
              | $SSH "tar xzpf - -C $REMOTE_BASE && echo '✅ hadrian upload complete'"
          fi

          if [ -n "$DELETED_MAIN" ]; then
            echo "=== Filtering deletes through safety allowlist ==="
            # SAFETY GUARD: only allow deletes inside the two intended subtrees.
            # Anything outside (e.g. hadrian/composer.json, hadrian/custom-page.php)
            # is logged and SKIPPED so it can never reach `rm -f` on the server.
            SAFE_MAIN=$(echo "$DELETED_MAIN" | grep -E '^hadrian/(modules/addons/Hadrian|templates/hadrian)/' || true)
            BLOCKED=$(echo "$DELETED_MAIN" | grep -vE '^hadrian/(modules/addons/Hadrian|templates/hadrian)/' || true)
            if [ -n "$BLOCKED" ]; then
              echo "⚠️  BLOCKED from delete (outside allowed subtrees):"
              echo "$BLOCKED"
            fi
            if [ -n "$SAFE_MAIN" ]; then
              echo "=== Deleting safe hadrian/ files ==="
              echo "$SAFE_MAIN"
              DEL=$(echo "$SAFE_MAIN" | sed "s|^hadrian/|rm -f '$REMOTE_BASE/|; s|$|'|")
              echo "$DEL" | $SSH "bash -s"
            fi
          fi

          # --------------------------------------------------------------
          # PASS 2: hadrian_cart/  ->  $REMOTE_BASE/templates/orderforms/hadrian_cart/
          #   hadrian_cart/css/x.css  -> templates/orderforms/hadrian_cart/css/x.css
          #   hadrian_cart/theme.yaml -> templates/orderforms/hadrian_cart/theme.yaml
          # PASS 2 is inherently safe — the sed hardcodes the destination
          # subtree, so deletes can ONLY happen inside templates/orderforms/hadrian_cart/.
          # --------------------------------------------------------------
          CHANGED_CART=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- 'hadrian_cart/**' | awk '!/\/\./ || /\/\.htaccess$/' || true)
          DELETED_CART=$(git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" -- 'hadrian_cart/**' | awk '!/\/\./ || /\/\.htaccess$/' || true)

          if [ -n "$CHANGED_CART" ]; then
            echo "=== Uploading hadrian_cart/ changes ==="
            echo "$CHANGED_CART"
            echo "$CHANGED_CART" | tar czf - --files-from=- --transform='s|^hadrian_cart/|templates/orderforms/hadrian_cart/|' \
              | $SSH "tar xzpf - -C $REMOTE_BASE && echo '✅ hadrian_cart upload complete'"
          fi

          if [ -n "$DELETED_CART" ]; then
            echo "=== Deleting removed hadrian_cart/ files ==="
            echo "$DELETED_CART"
            DEL=$(echo "$DELETED_CART" | sed "s|^hadrian_cart/|rm -f '$REMOTE_BASE/templates/orderforms/hadrian_cart/|; s|$|'|")
            echo "$DEL" | $SSH "bash -s"
          fi

          if [ -z "$CHANGED_MAIN" ] && [ -z "$CHANGED_CART" ] && [ -z "$DELETED_MAIN" ] && [ -z "$DELETED_CART" ]; then
            echo "No files to upload or delete."
          fi

  # ================================================================
  # The landing page. Unlike the theme, this is NOT copied from the
  # repo: dist/ is build output and gitignored, so there is nothing
  # committed to diff. CI runs the same build you run locally and
  # ships what it produces.
  #
  # REMOTE_LANDING_BASE is deliberately NOT $REMOTE_BASE: that is the
  # WHMCS billing root, and a marketing index.html on top of it would
  # sit in front of the client area's own entry point.
  # ================================================================
  deploy-landing:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: cp2.de.namespace.life
      REMOTE_USER: whymege
      REMOTE_PORT: '22'
      REMOTE_LANDING_BASE: /home/whymege/hadrianthegreat.com
      LANDING_SITE_URL: https://hadrianthegreat.com/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The workflow-level `paths:` fires for theme changes too, so the
      # build only runs when something the landing is made of moved.
      - name: Did the landing change?
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi
          # workflow_dispatch has no before/after worth diffing — always build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Manual run — building."
            exit 0
          fi
          HITS=$(git diff --name-only "$BEFORE" "$AFTER" -- \
            'hadrianthegreat-landind/**' \
            'apple-client-area/**' \
            'Hadrian by Caesarthemes/hadrian-admin-panel/**' \
            'scripts/build-landing.mjs' | grep -v '^hadrianthegreat-landind/dist/' || true)
          if [ -n "$HITS" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "$HITS"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Nothing the landing is built from changed."
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'yes'
        with:
          node-version: '20'

      - name: Build dist/
        if: steps.changed.outputs.run == 'yes'
        run: |
          node scripts/build-landing.mjs
          test -f hadrianthegreat-landind/dist/index.html || { echo "::error::build produced no index.html"; exit 1; }
          # The build falls back to copying PNGs when the encoder cannot be
          # reached. That is fine locally and wrong here — it would quietly ship
          # 2.9 MB of images — so fail instead.
          if ls hadrianthegreat-landind/dist/screens/*.png >/dev/null 2>&1; then
            echo "::error::screens/ did not re-encode to webp — sharp-cli unavailable?"
            exit 1
          fi
          du -sh hadrianthegreat-landind/dist

      - name: Setup SSH
        if: steps.changed.outputs.run == 'yes'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$REMOTE_PORT" -t ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload dist/
        if: steps.changed.outputs.run == 'yes'
        run: |
          SSH="ssh -i $HOME/.ssh/id_ed25519 -p $REMOTE_PORT -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST"

          # Whole tree every time, not a diff: dist/ is regenerated from
          # scratch on each build, so a "changed files" list would be every
          # file anyway. Extract is additive — nothing on the server is
          # removed. Renaming or deleting a source file therefore leaves the
          # old copy behind; see the note in the landing README for the
          # rsync --delete version if that ever matters.
          tar czf - -C hadrianthegreat-landind/dist . \
            | $SSH "mkdir -p '$REMOTE_LANDING_BASE' && tar xzpf - -C '$REMOTE_LANDING_BASE' && echo '✅ landing upload complete'"
