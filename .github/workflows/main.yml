name: Deploy theme to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'mytheme/modules/addons/MyTheme/**'
      - 'mytheme/templates/mytheme/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

# Uses lftp `mirror --only-newer` over SFTP (incremental — only uploads files
# whose mtime is newer than the server copy). Works on cPanel hosts that don't
# expose rsync. ${{ secrets.CPANEL }} = the ed25519 private key authorized in
# cPanel → Security → SSH Access → Manage SSH Keys.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: cp2.de.namespace.life
      REMOTE_USER: whymege
      REMOTE_PORT: 22
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp & prepare SSH key
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssh-client
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$REMOTE_PORT" -t ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync MyTheme addon module
        run: |
          lftp -u "$REMOTE_USER," -p "$REMOTE_PORT" "sftp://$REMOTE_HOST" <<'EOF'
            set sftp:connect-program "ssh -a -x -i /home/runner/.ssh/id_ed25519"
            set sftp:auto-confirm yes
            mirror --reverse --only-newer --delete --verbose --parallel=4 \
                   --exclude-glob .git/** \
                   mytheme/modules/addons/MyTheme/ \
                   /home/whymege/bill.hostnodes.com/modules/addons/MyTheme/
            bye
          EOF

      - name: Sync mytheme template
        run: |
          lftp -u "$REMOTE_USER," -p "$REMOTE_PORT" "sftp://$REMOTE_HOST" <<'EOF'
            set sftp:connect-program "ssh -a -x -i /home/runner/.ssh/id_ed25519"
            set sftp:auto-confirm yes
            mirror --reverse --only-newer --delete --verbose --parallel=4 \
                   --exclude-glob .git/** \
                   mytheme/templates/mytheme/ \
                   /home/whymege/bill.hostnodes.com/templates/mytheme/
            bye
          EOF
