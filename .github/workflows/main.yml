name: Deploy theme to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'mytheme/modules/addons/MyTheme/**'
      - 'mytheme/templates/mytheme/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync MyTheme addon module (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL }}
          REMOTE_HOST: cp2.de.namespace.life
          REMOTE_USER: whymege
          REMOTE_PORT: 22
          SOURCE: 'mytheme/modules/addons/MyTheme/'
          TARGET: '/home/whymege/bill.hostnodes.com/modules/addons/MyTheme/'
          ARGS: '-rltvz --delete'

      - name: Sync mytheme template (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL }}
          REMOTE_HOST: cp2.de.namespace.life
          REMOTE_USER: whymege
          REMOTE_PORT: 22
          SOURCE: 'mytheme/templates/mytheme/'
          TARGET: '/home/whymege/bill.hostnodes.com/templates/mytheme/'
          ARGS: '-rltvz --delete'
